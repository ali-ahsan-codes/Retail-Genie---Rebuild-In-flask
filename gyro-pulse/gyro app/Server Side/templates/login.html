<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Gyro Pulse – Login</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <!-- Manrope Font -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <!-- Material Symbols (optional) -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --brand-primary: #0052FF;
            --brand-surface: #f7f9fb;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
        }
        body {
            font-family: 'Manrope', sans-serif;
            background: var(--brand-surface);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            margin: 0;
        }
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }
        .brand-icon {
            width: 48px;
            height: 48px;
            background: var(--brand-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
        }
        .btn-brand {
            background-color: var(--brand-primary);
            color: white;
            border-radius: 10px;
            padding: 12px 24px;
            font-weight: 600;
            transition: all 0.2s ease;
            border: none;
            width: 100%;
        }
        .btn-brand:hover {
            background-color: #0041cc;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 82, 255, 0.3);
        }
        .input-field {
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            padding: 12px 16px;
            width: 100%;
            transition: border-color 0.2s;
            font-size: 0.95rem;
        }
        .input-field:focus {
            outline: none;
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(0, 82, 255, 0.15);
        }
        .alert-error {
            background: #fee2e2;
            color: #dc2626;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .brand-text {
            color: var(--brand-primary);
            font-weight: 800;
        }
    </style>
</head>
<body>

    <div class="w-full max-w-md">
        <!-- Card -->
        <div class="glass-card p-8 md:p-10 bg-white/80 backdrop-blur-xl">

            <!-- Logo / Brand -->
            <div class="flex items-center gap-3 mb-2">
                <div class="brand-icon">
                    <span class="material-symbols-outlined">analytics</span>
                </div>
                <h1 class="text-2xl font-extrabold tracking-tight text-slate-800">
                    Gyro <span class="brand-text">Pulse</span>
                </h1>
            </div>
            <p class="text-slate-500 text-sm mb-8">Log in to your account</p>

            <!-- Flash messages -->
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="alert-error mb-6">
                        <span class="material-symbols-outlined text-base align-middle mr-1">error</span>
                        {{ messages[0] }}
                    </div>
                {% endif %}
            {% endwith %}

            <!-- Login Form -->
            <form method="POST" class="space-y-5">
                <div>
                    <label for="username" class="block text-sm font-semibold text-slate-700 mb-1.5">Username</label>
                    <input type="text" name="username" id="username" class="input-field" placeholder="Enter your username" required autofocus>
                </div>
                <div>
                    <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
                    <input type="password" name="password" id="password" class="input-field" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-brand flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-xl">login</span>
                    Sign In
                </button>
            </form>

            <div class="mt-8 text-center text-xs text-slate-400 border-t border-slate-100 pt-6">
                <span class="material-symbols-outlined text-sm align-middle mr-1">security</span>
                Secure &bull; Gyro Pulse v3.0
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (for toasts if needed) – optional but keep it -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0-alpha1/js/bootstrap.bundle.min.js"></script>
</body>
</html>
